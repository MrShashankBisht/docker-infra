volumes:
  ollama_data:
  open-webui-data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    network_mode: "host"  # Restored: Fixes the DNS pull issue and exposes it to the host
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    environment:
      # 172.17.0.1 is how a Docker container reaches the Ubuntu host machine
      - OLLAMA_BASE_URL=http://172.17.0.1:11434 
    ports:
      - "3005:9010"
    volumes:
      - open-webui-data:/app/backend/data
    restart: always